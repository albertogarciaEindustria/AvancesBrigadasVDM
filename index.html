<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Solo se ejecuta código del propio sitio y de Leaflet (verificado con SRI);
     no se puede mandar nada a otros servidores ni incrustar formularios u objetos -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://unpkg.com; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<title>Avance Brigadas VDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/estilos.css?v=20261021010026">
</head>
<body class="modo-intro">

<!-- ── Pantalla de inicio ─────────────────────────────────────────────── -->
<section id="intro" aria-label="Inicio">
  <canvas id="matriz" aria-hidden="true"></canvas>
  <div class="intro-velo" aria-hidden="true"></div>
  <div class="intro-centro">
    <p class="intro-kicker" id="introKicker">CARGANDO</p>
    <pre class="intro-titulo" id="introTitulo" role="img" aria-label="Avance VDM"></pre>
    <p class="intro-sub"><span id="introSub"></span><span class="cursor" aria-hidden="true">_</span></p>
    <button class="btn-entrar" id="btnEntrar" type="button" disabled>Ver avance<span class="flecha" aria-hidden="true">→</span></button>
    <p class="intro-pie" id="introPie"></p>
  </div>
</section>

<!-- ── Acceso: unidad + contraseña ────────────────────────────────────── -->
<div id="acceso" class="acceso" hidden>
  <form class="acceso-caja" id="formAcceso" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="accesoTitulo">
    <div class="acceso-titulo" id="accesoTitulo"><span>┌─</span> ACCESO <span class="acceso-linea"></span></div>
    <p class="acceso-pregunta">&gt; ¿Qué unidad operativa quieres ver?</p>
    <div class="acceso-opciones" id="accesoOpciones" role="radiogroup" aria-label="Unidad operativa"></div>
    <label class="acceso-pregunta" for="accesoPass">&gt; Contraseña</label>
    <div class="acceso-pass">
      <span aria-hidden="true">[</span>
      <input type="password" id="accesoPass" autocomplete="current-password" spellcheck="false">
      <span aria-hidden="true">]</span>
    </div>
    <p class="acceso-estado" id="accesoEstado" role="status" aria-live="polite"></p>
    <div class="acceso-botones">
      <button type="submit" class="acceso-btn principal" id="accesoEntrar">[ ENTRAR ]</button>
      <button type="button" class="acceso-btn" id="accesoCancelar">[ CANCELAR ]</button>
    </div>
  </form>
</div>

<!-- ── Vistas (se llenan al descifrar) ────────────────────────────────── -->
<main id="vistaUnidad" class="vista-unidad" hidden></main>
<main id="vistaLider" class="vista-lider" hidden></main>

<div id="tooltip" class="tooltip" role="tooltip" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/cripto.js?v=20261021010026"></script>
<script src="js/graficas.js?v=20261021010026"></script>
<script src="js/intro.js?v=20261021010026"></script>
<script src="js/buscador.js?v=20261021010026"></script>
<script src="js/unidad.js?v=20261021010026"></script>
<script src="js/lider.js?v=20261021010026"></script>
<script src="js/app.js?v=20261021010026"></script>
</body>
</html>
